name: inception

services:
  mariadb:
    container_name: mariadb
    networks:
      - inception
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    image: mariadb
    env_file: .env
    restart: always
    ports:
      - "3307:3306"
    volumes:
      - mariadb:/var/lib/mysql

  nginx:
    container_name: nginx
    depends_on:
      - wordpress
    networks:
      - inception
    build:
      context: ./requirements/nginx/
      dockerfile: Dockerfile
    image: nginx
    env_file: .env
    restart: always
    volumes:
      - "wordpress:/var/www/wordpress"
    ports:
    - "443:443"

  wordpress:
    container_name: wordpress
    networks:
      - inception
    ports:
      - "9000:9000"
    env_file: .env
    depends_on:
      - mariadb
    restart: always
    build:
      context: ./requirements/wordpress/
      dockerfile: Dockerfile
    image: wordpress
    volumes:
      - "wordpress:/var/www/wordpress"

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lefoffan/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lefoffan/data/wordpress

networks:
  inception:
    driver: bridge

